<mat-sidenav-container class="organizer-layout">
  <mat-sidenav
    class="organizer-sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="isHandset() ? sidenavOpen() : true"
    (openedChange)="onSidenavOpenedChange($event)"
  >
    <div class="brand">
      <mat-icon>sports</mat-icon>
      <span>Plataforma</span>
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        [routerLink]="homeRoute"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidenavIfHandset()"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Início</span>
      </a>

      @if (isOrganizer()) {
        <a
          mat-list-item
          [routerLink]="myEventsRoute"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeSidenavIfHandset()"
        >
          <mat-icon matListItemIcon>event</mat-icon>
          <span matListItemTitle>Meus eventos</span>
        </a>
        <a
          mat-list-item
          [routerLink]="createEventRoute"
          routerLinkActive="active"
          (click)="closeSidenavIfHandset()"
        >
          <mat-icon matListItemIcon>add_circle</mat-icon>
          <span matListItemTitle>Criar evento</span>
        </a>
      } @else {
        <a
          mat-list-item
          [routerLink]="myRegistrationsRoute"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeSidenavIfHandset()"
        >
          <mat-icon matListItemIcon>emoji_events</mat-icon>
          <span matListItemTitle>Meus eventos</span>
        </a>
        <a mat-list-item [routerLink]="publicEventsRoute" (click)="closeSidenavIfHandset()">
          <mat-icon matListItemIcon>explore</mat-icon>
          <span matListItemTitle>Ver eventos</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="organizer-main">
    <mat-toolbar color="primary" class="organizer-toolbar">
      @if (isHandset()) {
        <button
          mat-icon-button
          type="button"
          class="menu-button"
          aria-label="Abrir menu"
          (click)="toggleSidenav()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }

      <span class="toolbar-title">Minha área</span>
      <span class="spacer"></span>
      @if (auth.currentUser(); as user) {
        <span class="user-name" [attr.title]="user.name">{{ user.name }}</span>
      }
      <button mat-icon-button type="button" aria-label="Sair" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="organizer-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
